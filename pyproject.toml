[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-lockup"
version = "0.1.0"
description = "Korean DART Lockup Schedule Extraction System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KB Lockup Team"}
]
keywords = ["dart", "lockup", "korean", "stock", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "aiohttp>=3.9",
    "openai>=1.0",
    "aiosqlite>=0.19",
    "python-telegram-bot>=20.0",
    "apscheduler>=3.10",
    "streamlit>=1.30",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.0",
    "loguru>=0.7",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]
excel = [
    "xlwings>=0.30",
]

[project.scripts]
kb-lockup = "kb_lockup.main:cli"

[project.urls]
Homepage = "https://github.com/your-org/kb-lockup"
Documentation = "https://github.com/your-org/kb-lockup#readme"
Repository = "https://github.com/your-org/kb-lockup"

[tool.setuptools.packages.find]
where = ["."]
include = ["kb_lockup*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
